name: nexus

services:

  garage:
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: "${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET is required}"
      GARAGE_DEFAULT_ACCESS_KEY: "${GARAGE_ACCESS_KEY_ID:?GARAGE_ACCESS_KEY_ID is required}"
      GARAGE_DEFAULT_SECRET_KEY: "${GARAGE_SECRET_ACCESS_KEY:?GARAGE_SECRET_ACCESS_KEY is required}"
      GARAGE_DEFAULT_BUCKET: "${GARAGE_BUCKET:-nexus-images}"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "127.0.0.1:${GARAGE_PORT:-3900}:3900"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

 
  nats:
    image: nats:2.15.0-alpine
    restart: unless-stopped


    command: ["-js", "-sd", "/data"]

    ports:
     
      - "127.0.0.1:${NATS_PORT:-4222}:4222"

    volumes:
    
      - nats_data:/data

    networks:
     
      - backend
  outbox-publisher:
 
    build:
      context: .
      dockerfile: Dockerfile

   
    entrypoint: ["/app/nexus-outbox-publisher"]
    init: true
    restart: unless-stopped

   
    depends_on:
      mongodb:
        condition: service_healthy
      nats:
        condition: service_started

    environment:
    
      MONGODB_DATABASE: "${MONGODB_DATABASE:?MONGODB_DATABASE is required}"
      MONGODB_URI: "${MONGODB_URI:?MONGODB_URI is required}"
      MONGODB_CONNECT_TIMEOUT: "${MONGODB_CONNECT_TIMEOUT:?MONGODB_CONNECT_TIMEOUT is required}"
      MONGODB_OPERATION_TIMEOUT: "${MONGODB_OPERATION_TIMEOUT:?MONGODB_OPERATION_TIMEOUT is required}"

     
      NATS_URL: "nats://nats:4222"

      OUTBOX_CONCURRENCY: "${OUTBOX_CONCURRENCY:-4}"
      OUTBOX_RECOVERY_INTERVAL: "${OUTBOX_RECOVERY_INTERVAL:-5s}"
      OUTBOX_RECOVERY_BATCH_SIZE: "${OUTBOX_RECOVERY_BATCH_SIZE:-100}"

    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    stop_grace_period: 30s
    networks:
      - backend

  delivery-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/nexus-delivery-dispatcher"]
    init: true
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      MONGODB_DATABASE: "${MONGODB_DATABASE:?MONGODB_DATABASE is required}"
      MONGODB_URI: "${MONGODB_URI:?MONGODB_URI is required}"
      MONGODB_CONNECT_TIMEOUT: "${MONGODB_CONNECT_TIMEOUT:?MONGODB_CONNECT_TIMEOUT is required}"
      MONGODB_OPERATION_TIMEOUT: "${MONGODB_OPERATION_TIMEOUT:?MONGODB_OPERATION_TIMEOUT is required}"
      NATS_URL: "nats://nats:4222"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    stop_grace_period: 40s
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile

    init: true
    restart: unless-stopped

    depends_on:
      garage:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      nats:
        condition: service_started

    ports:
      - "${BACKEND_PORT:?BACKEND_PORT is required}:8080"

    environment:
      GARAGE_ENDPOINT: "http://garage:3900"
      GARAGE_PUBLIC_ENDPOINT: "${GARAGE_PUBLIC_ENDPOINT:?GARAGE_PUBLIC_ENDPOINT is required}"
      GARAGE_REGION: "${GARAGE_REGION:-garage}"
      GARAGE_BUCKET: "${GARAGE_BUCKET:-nexus-images}"
      GARAGE_ACCESS_KEY_ID: "${GARAGE_ACCESS_KEY_ID:?GARAGE_ACCESS_KEY_ID is required}"
      GARAGE_SECRET_ACCESS_KEY: "${GARAGE_SECRET_ACCESS_KEY:?GARAGE_SECRET_ACCESS_KEY is required}"
      HTTP_ADDRESS: "${HTTP_ADDRESS:?HTTP_ADDRESS is required}"
      HTTP_READ_HEADER_TIMEOUT: "${HTTP_READ_HEADER_TIMEOUT:?HTTP_READ_HEADER_TIMEOUT is required}"
      HTTP_READ_TIMEOUT: "${HTTP_READ_TIMEOUT:?HTTP_READ_TIMEOUT is required}"
      HTTP_WRITE_TIMEOUT: "${HTTP_WRITE_TIMEOUT:?HTTP_WRITE_TIMEOUT is required}"
      HTTP_IDLE_TIMEOUT: "${HTTP_IDLE_TIMEOUT:?HTTP_IDLE_TIMEOUT is required}"
      HTTP_SHUTDOWN_TIMEOUT: "${HTTP_SHUTDOWN_TIMEOUT:?HTTP_SHUTDOWN_TIMEOUT is required}"
      HTTP_MAX_HEADER_BYTES: "${HTTP_MAX_HEADER_BYTES:?HTTP_MAX_HEADER_BYTES is required}"
      HTTP_ALLOWED_ORIGINS: "${HTTP_ALLOWED_ORIGINS:?HTTP_ALLOWED_ORIGINS is required}"
      NATS_URL: "nats://nats:4222"
      REALTIME_READY_TIMEOUT: "${REALTIME_READY_TIMEOUT:-10s}"
      REALTIME_NATS_FLUSH_TIMEOUT: "${REALTIME_NATS_FLUSH_TIMEOUT:-5s}"
      REALTIME_PING_INTERVAL: "${REALTIME_PING_INTERVAL:-25s}"
      REALTIME_PONG_TIMEOUT: "${REALTIME_PONG_TIMEOUT:-10s}"
      REALTIME_WRITE_TIMEOUT: "${REALTIME_WRITE_TIMEOUT:-10s}"
      REALTIME_MAX_MESSAGE_BYTES: "${REALTIME_MAX_MESSAGE_BYTES:-32768}"
      REALTIME_OUTBOUND_QUEUE_MESSAGES: "${REALTIME_OUTBOUND_QUEUE_MESSAGES:-100}"
      REALTIME_OUTBOUND_QUEUE_BYTES: "${REALTIME_OUTBOUND_QUEUE_BYTES:-1048576}"
      REALTIME_SESSION_CHECK_INTERVAL: "${REALTIME_SESSION_CHECK_INTERVAL:-60s}"
      REALTIME_SESSION_CHECK_TIMEOUT: "${REALTIME_SESSION_CHECK_TIMEOUT:-5s}"
      REALTIME_MAX_CONNECTIONS_PER_USER: "${REALTIME_MAX_CONNECTIONS_PER_USER:-10}"
      REALTIME_MAX_CONNECTIONS_PER_INSTANCE: "${REALTIME_MAX_CONNECTIONS_PER_INSTANCE:-5000}"
      REALTIME_SHUTDOWN_TIMEOUT: "${REALTIME_SHUTDOWN_TIMEOUT:-10s}"
      MONGODB_DATABASE: "${MONGODB_DATABASE:?MONGODB_DATABASE is required}"
      MONGODB_URI: "${MONGODB_URI:?MONGODB_URI is required}"
      APP_ENV: "${APP_ENV:?APP_ENV is required}"
      MONGODB_CONNECT_TIMEOUT: "${MONGODB_CONNECT_TIMEOUT:?MONGODB_CONNECT_TIMEOUT is required}"
      MONGODB_OPERATION_TIMEOUT: "${MONGODB_OPERATION_TIMEOUT:?MONGODB_OPERATION_TIMEOUT is required}"

      JWT_ISSUER: "${JWT_ISSUER:?JWT_ISSUER is required}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:?JWT_AUDIENCE is required}"
      JWT_ACCESS_SECRET_BASE64: "${JWT_ACCESS_SECRET_BASE64:?JWT_ACCESS_SECRET_BASE64 is required}"
      JWT_REFRESH_SECRET_BASE64: "${JWT_REFRESH_SECRET_BASE64:?JWT_REFRESH_SECRET_BASE64 is required}"
      AUTH_ACCESS_TOKEN_TTL: "${AUTH_ACCESS_TOKEN_TTL:-15m}"
      AUTH_REFRESH_TOKEN_TTL: "${AUTH_REFRESH_TOKEN_TTL:-168h}"
      REFRESH_TOKEN_PEPPER: "${REFRESH_TOKEN_PEPPER:?REFRESH_TOKEN_PEPPER is required}"

      AUTH_ACCESS_COOKIE_NAME: "${AUTH_ACCESS_COOKIE_NAME:?AUTH_ACCESS_COOKIE_NAME is required}"
      AUTH_REFRESH_COOKIE_NAME: "${AUTH_REFRESH_COOKIE_NAME:?AUTH_REFRESH_COOKIE_NAME is required}"
      AUTH_COOKIE_DOMAIN: "${AUTH_COOKIE_DOMAIN:-}"
      AUTH_COOKIE_PATH: "${AUTH_COOKIE_PATH:?AUTH_COOKIE_PATH is required}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:?AUTH_COOKIE_SECURE is required}"
      AUTH_COOKIE_SAME_SITE: "${AUTH_COOKIE_SAME_SITE:?AUTH_COOKIE_SAME_SITE is required}"

    read_only: true

    tmpfs:
      - "/tmp:size=128m,noexec,nosuid"

    cap_drop:
      - ALL

    security_opt:
      - "no-new-privileges:true"

    stop_grace_period: 45s

    networks:
      - backend

  mongodb-keyfile:
    image: mongo:8.0.29-noble
    entrypoint:
      - /bin/bash
      - -ec
      - |
        if [ ! -s /mongo-keyfile/keyfile ]; then
          openssl rand -base64 756 > /mongo-keyfile/keyfile
        fi
        chown mongodb:mongodb /mongo-keyfile/keyfile
        chmod 400 /mongo-keyfile/keyfile
    volumes:
      - mongodb_keyfile:/mongo-keyfile

  mongodb:
    image: mongo:8.0.29-noble
    restart: unless-stopped
    depends_on:
      mongodb-keyfile:
        condition: service_completed_successfully

    command:
      - mongod
      - --replSet
      - rs0
      - --keyFile
      - /mongo-keyfile/keyfile
      - --bind_ip_all

    ports:
      - "${MONGODB_PORT:-27019}:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}"
      MONGO_INITDB_DATABASE: "admin"
      MONGO_APP_DATABASE: "${MONGO_APP_DATABASE:?MONGO_APP_DATABASE is required}"
     
      

    volumes:
      - mongodb_data:/data/db
      - mongodb_keyfile:/mongo-keyfile:ro
      
      

    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          mongosh --quiet
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval 'try { const status = rs.status(); if (status.myState !== 1) quit(2); } catch (error) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]}); quit(2); }'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - backend

volumes:
  garage_meta:
  garage_data:
  mongodb_data:
  mongodb_keyfile:
  nats_data:

networks:
  backend:
    driver: bridge
